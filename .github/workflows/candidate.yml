name: Validate Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'global.json'
      - '.editorconfig'
      - 'src/SlashText/SlashText.csproj'
      - 'src/SlashText/app.manifest'
      - 'docs/releases/**'
      - 'scripts/candidate-package-smoke.ps1'
      - '.github/workflows/candidate.yml'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.4xx
          dotnet-quality: ga

      - name: Record selected SDK and runtime environment
        run: dotnet --info

      - name: Restore production publish inputs
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64

      - name: Publish production portable layout
        run: dotnet publish src/SlashText/SlashText.csproj -c Release -p:Platform=x64 -p:PublishProfile=Portable --no-restore --output candidate/portable

      - name: Publish production installed staging
        run: dotnet publish src/SlashText/SlashText.csproj -c Release -p:Platform=x64 -p:PublishProfile=Installed --no-restore --output candidate/installed

      - name: Verify exact published packages
        shell: pwsh
        run: |
          ./scripts/candidate-package-smoke.ps1 -Executable candidate/portable/SlashDesk.exe -Layout Portable -OutputDirectory candidate-evidence/portable
          ./scripts/candidate-package-smoke.ps1 -Executable candidate/installed/SlashDesk.exe -Layout Installed -OutputDirectory candidate-evidence/installed
          ./scripts/security-inventory.ps1 -Executable candidate/portable/SlashDesk.exe -OutputDirectory candidate-evidence/inventory-portable
          ./scripts/security-inventory.ps1 -Executable candidate/installed/SlashDesk.exe -OutputDirectory candidate-evidence/inventory-installed -Layout directory

      - name: Package validation artifacts without publishing a release
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/SlashText/SlashText.csproj -Raw
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $files = @(Get-ChildItem candidate/portable -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'SlashDesk.exe') { throw 'Unexpected portable layout.' }
          New-Item candidate-packages -ItemType Directory | Out-Null
          foreach ($layout in @('portable', 'installed')) {
            $suffix = if ($layout -eq 'portable') { 'portable' } else { 'installed-staging' }
            $zip = "candidate-packages/SlashDesk-$version-$suffix-win-x64.zip"
            Compress-Archive -Path "candidate/$layout/*" -DestinationPath $zip
            "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $zip -Leaf)" |
              Set-Content "$zip.sha256" -Encoding ascii -NoNewline
          }
          [ordered]@{ stage = 'validation-candidate'; version = $version; sourceCommit = (git rev-parse HEAD); releasePublished = $false } |
            ConvertTo-Json | Set-Content candidate-packages/candidate.json -Encoding utf8

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SlashDesk-candidate-evidence
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SlashDesk-candidate-packages
          path: candidate-packages/
          if-no-files-found: error
          retention-days: 30
