name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SlashText.sln -p:Platform=x64

      - name: Build
        run: dotnet build SlashText.sln --configuration Release --no-restore -p:Platform=x64

      - name: UI integrity smoke
        shell: pwsh
        run: ./scripts/ui-integrity-smoke.ps1

      - name: Smoke tests
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release --no-build -p:Platform=x64

      - name: Restore portable runtime
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64

      - name: Publish portable app
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=false
          --output publish

      - name: Assemble clean package
        shell: pwsh
        run: |
          Copy-Item publish package -Recurse
          if (-not (Test-Path package/SlashDesk.exe)) {
            throw "O executável x64 não foi publicado."
          }
          $recorderFiles = Get-ChildItem package -Recurse -File |
            Where-Object { $_.Name -like 'ScreenRecorderLib*' }
          if ($recorderFiles.Count -lt 1) {
            throw "Os componentes do ScreenRecorderLib não foram publicados."
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-2.9.1-test-candidate-win-x64
          path: package/
          if-no-files-found: error
