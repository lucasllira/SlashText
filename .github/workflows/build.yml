name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SlashText.sln -p:Platform=x64

      - name: Build
        run: dotnet build SlashText.sln --configuration Release --no-restore -p:Platform=x64

      - name: UI integrity smoke
        shell: pwsh
        run: ./scripts/ui-integrity-smoke.ps1

      - name: Smoke tests
        run: dotnet run --project tests/SlashText.SmokeTests/SlashText.SmokeTests.csproj --configuration Release --no-build -p:Platform=x64

      - name: Restore portable runtime
        run: dotnet restore src/SlashText/SlashText.csproj --runtime win-x64 -p:Platform=x64

      - name: Publish portable app
        run: >
          dotnet publish src/SlashText/SlashText.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          --output publish

      - name: Assemble clean package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/SlashDeskData | Out-Null
          Copy-Item publish/SlashDesk.exe package/SlashDesk.exe
          Copy-Item snippets.md package/SlashDeskData/snippets.md
          $unexpected = Get-ChildItem package -File |
            Where-Object { $_.Name -ne 'SlashDesk.exe' }
          if ($unexpected) {
            throw "O pacote contém arquivos inesperados na raiz: $($unexpected.Name -join ', ')"
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: SlashDesk-2.9.1-test-candidate-win-x64
          path: package/
          if-no-files-found: error
